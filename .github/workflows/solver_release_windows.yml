name: GitHub Actions Lab06 solver for Windows
on:
  push:
    tags:
    - v**
permissions:
  contents: write
jobs: 
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout repository master
      uses: actions/checkout@master
    - name: Configure CMake for solver
      run: |
        $t1 = $Env:GITHUB_REF_NAME.Replace('v', '')
        cmake -S ${{github.workspace}}/ -B ${{github.workspace}}/build -D PRINT_VERSION=$t1 -D CPACK_GENERATOR="WIX"
    - name: Build Solver
      run: cmake --build ${{github.workspace}}/build
    - name: Build package for solver
      run: cmake --build ${{github.workspace}}/build --target package
    - name: Make a release
      uses: ncipollo/release-action@v1.21.0
      with:
        artifacts: "build/*.msi"
        replacesArtifacts: false
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        allowUpdates: true
